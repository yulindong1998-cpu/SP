<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finance Dashboard</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
body{
    margin:0;
    font-family:Arial,sans-serif;
    background:#0d1117;
    color:white;
}

header{
    background:#161b22;
    padding:20px;
    text-align:center;
}

.controls{
    padding:20px;
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px;
}

select,button{
    padding:10px;
    border:none;
    border-radius:6px;
}

button{
    background:#00bcd4;
    cursor:pointer;
    font-weight:bold;
}

.kpis{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
    gap:10px;
    padding:20px;
}

.card{
    background:#161b22;
    padding:15px;
    border-radius:10px;
}

.value{
    font-size:24px;
    font-weight:bold;
    margin-top:10px;
}

.chartContainer{
    padding:20px;
}

.summary{
    background:#161b22;
    margin:20px;
    padding:20px;
    border-radius:10px;
}
</style>
</head>
<body>

<header>
    <h1>Advanced Finance Dashboard</h1>
    <p>Real-Time Stock Analysis</p>
</header>

<div class="controls">

<select id="ticker">
    <option value=".INX">S&amp;P 500</option>
    <option>AAPL</option>
    <option>MSFT</option>
    <option>NVDA</option>
    <option>TSLA</option>
    <option>AMZN</option>
</select>

<select>
    <option>1 Month</option>
    <option>3 Months</option>
    <option>6 Months</option>
    <option>1 Year</option>
</select>

<select>
    <option>Stock Price</option>
    <option>Revenue</option>
    <option>EPS</option>
    <option>Net Income</option>
</select>

<select>
    <option>Linear Forecast</option>
    <option>Moving Average</option>
    <option>Growth Trend</option>
</select>

<select>
    <option>MSFT</option>
    <option>AAPL</option>
    <option>NVDA</option>
    <option>TSLA</option>
</select>

<select>
    <option>Line</option>
    <option>Bar</option>
</select>

<button onclick="loadStock()">Update Analysis</button>

</div>

<div class="kpis">
    <div class="card">
        <h3>Price</h3>
        <div class="value" id="price">$--</div>
    </div>

    <div class="card">
        <h3>Change</h3>
        <div class="value" id="change">--%</div>
    </div>

    <div class="card">
        <h3>P/E Ratio</h3>
        <div class="value" id="pe">--</div>
    </div>

    <div class="card">
        <h3>Revenue Growth</h3>
        <div class="value" id="growth">--%</div>
    </div>
</div>

<div class="chartContainer">
    <canvas id="myChart"></canvas>
</div>

<div class="summary">
    <h2>AI Investment Summary</h2>
    <p id="summaryText">
        Click Update Analysis.
    </p>
</div>

<script>

const API_KEY = "YOUR_API_KEY";

let chart;

async function loadStock(){

    let ticker =
        document.getElementById("ticker").value;

    let url =
`https://www.alphavantage.co/query?function=GLOBAL_QUOTE&symbol=${ticker}&apikey=${API_KEY}`;

    try{

        const response =
            await fetch(url);

        const data =
            await response.json();

        const quote =
            data["Global Quote"];

        const price =
            quote["05. price"];

        const change =
            quote["10. change percent"];

        document.getElementById("price")
        .innerHTML="$"+Number(price).toFixed(2);

        document.getElementById("change")
        .innerHTML=change;

        document.getElementById("pe")
        .innerHTML=(15+Math.random()*15).toFixed(2);

        document.getElementById("growth")
        .innerHTML=(5+Math.random()*20).toFixed(1)+"%";

        drawChart();

        document.getElementById("summaryText")
        .innerHTML=
        ticker +
        " shows healthy financial performance. Revenue growth and profitability remain stable. Investors should compare valuation metrics against industry peers before making investment decisions.";

    }
    catch(error){

        alert("API Error or Missing API Key");
    }
}

function drawChart(){

    const labels=
    ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];

    const values=
    labels.map(()=>Math.floor(Math.random()*100)+100);

    if(chart){
        chart.destroy();
    }

    chart = new Chart(
        document.getElementById("myChart"),
        {
            type:"line",
            data:{
                labels:labels,
                datasets:[{
                    label:"Stock Price Trend",
                    data:values,
                    borderColor:"#00bcd4",
                    backgroundColor:"rgba(0,188,212,.3)",
                    fill:true
                }]
            }
        }
    );
}

</script>

</body>
</html>
