<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="S&P 500 index chart and market overview.">
<title>S&amp;P 500 Dashboard</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0d1117;
    color: #f0f6fc;
}

header {
    padding: 28px 20px;
    text-align: center;
    background: #161b22;
    border-bottom: 1px solid #30363d;
}

h1 {
    margin: 0;
    font-size: clamp(1.7rem, 4vw, 2.4rem);
}

header p {
    margin: 10px 0 0;
    color: #8b949e;
}

main {
    width: min(1200px, 100%);
    margin: 0 auto;
    padding: 24px 20px;
}

.index-card {
    overflow: hidden;
    padding: 20px;
    background: #161b22;
    border: 1px solid #30363d;
    border-radius: 12px;
}

.index-card h2 {
    margin: 0 0 16px;
    font-size: 1.2rem;
}

.chart {
    height: min(72vh, 680px);
    min-height: 420px;
}

.tradingview-widget-container,
.tradingview-widget-container__widget {
    width: 100%;
    height: 100%;
}

.attribution {
    margin: 14px 0 0;
    color: #8b949e;
    font-size: 0.85rem;
    text-align: right;
}

.attribution a {
    color: #58a6ff;
}

@media (max-width: 600px) {
    main {
        padding: 16px 12px;
    }

    .index-card {
        padding: 14px;
    }

    .chart {
        height: 65vh;
        min-height: 380px;
    }
}
</style>
</head>
<body>
<header>
    <h1>S&amp;P 500 Dashboard</h1>
    <p>Explore the S&amp;P 500 index with an interactive market chart.</p>
</header>

<main>
    <section class="index-card" aria-labelledby="index-heading">
        <h2 id="index-heading">S&amp;P 500 Index (SP:SPX)</h2>
        <div class="chart">
            <div class="tradingview-widget-container">
                <div class="tradingview-widget-container__widget"></div>
                <script
                    type="text/javascript"
                    src="https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js"
                    async
                >
                {
                    "autosize": true,
                    "calendar": false,
                    "details": true,
                    "hide_side_toolbar": false,
                    "hide_top_toolbar": false,
                    "interval": "D",
                    "locale": "en",
                    "save_image": false,
                    "style": "1",
                    "symbol": "SP:SPX",
                    "theme": "dark",
                    "timezone": "Etc/UTC",
                    "withdateranges": true,
                    "allow_symbol_change": false,
                    "studies": [],
                    "support_host": "https://www.tradingview.com"
                }
                </script>
            </div>
        </div>
        <p class="attribution">
            Market data and chart provided by
            <a href="https://www.tradingview.com/symbols/SPX/" target="_blank" rel="noopener noreferrer">TradingView</a>.
            Data availability and delays depend on the provider.
        </p>
    </section>
</main>
</body>
</html>
